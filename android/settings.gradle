pluginManagement {
    repositories {
        // dl.google.com is unreachable from this network: Google's Maven repo answers 404 for
        // *every* artifact, including AGP itself. The Aliyun mirror of Google Maven works, so it
        // goes first; google() stays as the canonical fallback on machines that can reach it.
        maven { url = 'https://maven.aliyun.com/repository/google' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    resolutionStrategy {
        // The same mirror serves Google's plugin *marker* POMs (com.google.gms.*, com.google.firebase.*)
        // with a 502 while serving the plugins themselves with a 200, and the Gradle Plugin Portal
        // answers for them with a redirect to Maven Central, where they do not exist. Pointing the
        // plugin ids straight at their modules skips the marker lookup entirely.
        eachPlugin {
            if (requested.id.id == 'com.google.gms.google-services') {
                useModule("com.google.gms:google-services:${requested.version}")
            } else if (requested.id.id == 'com.google.firebase.crashlytics') {
                useModule("com.google.firebase:firebase-crashlytics-gradle:${requested.version}")
            } else if (requested.id.id == 'com.google.firebase.appdistribution') {
                useModule("com.google.firebase:firebase-appdistribution-gradle:${requested.version}")
            }
        }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/google' } // see the note above
        google()
        mavenCentral()
        maven { url = 'https://www.jitpack.io' } // MPAndroidChart
    }
}
